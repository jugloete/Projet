name: internship-platform

services:
  mongo:
    image: mongo:7
    container_name: internship-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: internship_platform
    volumes:
      - mongo_data:/data/db
    networks:
      - internship-network

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: internship-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/internship_platform
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    networks:
      - internship-network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: internship-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - internship-network

networks:
  internship-network:
    driver: bridge

volumes:
  mongo_data:
